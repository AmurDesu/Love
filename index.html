<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя, любимая ♥</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080706;
    color: #c5a574;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
}

#scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 500px;
    overflow: hidden;
    background: radial-gradient(
        ellipse at center,
        #21170f 0%,
        #100c09 45%,
        #050505 100%
    );
}

.heading {
    position: absolute;
    z-index: 2;
    top: 5%;
    left: 0;
    width: 100%;
    text-align: center;
    color: #d0b17e;
    font-size: 11px;
    letter-spacing: 2px;
    line-height: 1.8;
    padding: 0 15px;
}

#drawing {
    position: absolute;
    width: min(78vw, 430px);
    height: min(70vh, 430px);
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    overflow: visible;
}

#heartLine {
    fill: none;
    stroke: #c5a574;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    filter: drop-shadow(0 0 6px #c5a574);
    animation: drawHeart 4s ease forwards;
}

@keyframes drawHeart {
    to {
        stroke-dashoffset: 0;
    }
}

/* Горизонтальные, контрастные и читаемые фразы */
.phrase {
    position: absolute;
    z-index: 3;
    transform: translate(-50%, -50%);
    max-width: calc(100vw - 24px);
    padding: 5px 9px;
    border: 1px solid rgba(197, 165, 116, 0.45);
    border-radius: 5px;
    background: rgba(12, 9, 7, 0.96);
    color: #ffe3b0;
    font-size: clamp(11px, 3vw, 14px);
    font-weight: bold;
    letter-spacing: 0.2px;
    line-height: 1.4;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 8px rgba(197, 165, 116, 0.5);
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    animation: phraseAppear 1.5s ease forwards;
}

@keyframes phraseAppear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.94);
    }

    20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
    }
}

#center {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    width: 100%;
    padding: 0 10px;
    text-align: center;
    color: #f0d5a2;
    font-size: clamp(19px, 5vw, 30px);
    letter-spacing: 2px;
    text-shadow: 0 0 20px #c5a574;
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
}

#center.show {
    opacity: 1;
}

.subtitle {
    margin-top: 13px;
    padding: 0 15px;
    font-size: 10px;
    letter-spacing: 1.5px;
    line-height: 1.8;
    color: #d0b17e;
}

#finale {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(
        ellipse at center,
        rgba(39, 25, 15, 0.98),
        rgba(5, 5, 5, 0.99) 75%
    );
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 2s ease, visibility 2s ease;
}

#finale.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.message {
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: messageAppear 2s ease both;
}

@keyframes messageAppear {
    from {
        transform: translateY(15px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.small {
    font-size: 10px;
    letter-spacing: 5px;
    line-height: 1.8;
    color: #c5a574;
    margin-bottom: 22px;
}

h2 {
    margin: 0;
    color: #ead2a6;
    font-size: clamp(34px, 9vw, 48px);
    font-weight: normal;
    letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(197, 165, 116, 0.4);
}

.big-heart {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100px;
    height: 90px;
    border: none;
    outline: none;
    background: transparent;
    padding: 0;
    margin: 20px 0;
    color: #c5a574;
    font-family: Georgia, serif;
    font-size: 66px;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    position: relative;
    z-index: 20;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    animation: heartbeat 1.8s ease-in-out infinite;
    transition: color 0.4s, transform 0.4s;
}

.big-heart:focus-visible {
    outline: 1px solid #c5a574;
    border-radius: 15px;
}

.big-heart:active {
    transform: scale(1.2);
}

.big-heart.open {
    color: #f0b8a9;
    transform: scale(1.15);
    animation: none;
    text-shadow: 0 0 25px rgba(240, 184, 169, 0.8);
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

#secretMessage {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: opacity 1.2s ease, max-height 1.2s ease;
    color: #e7d5b8;
    font-size: 17px;
    line-height: 1.8;
}

#secretMessage.show {
    max-height: 250px;
    opacity: 1;
}

#secretMessage p {
    margin: 5px 0 15px;
}

.signature {
    color: #c5a574;
    font-size: 14px;
    font-style: italic;
    padding-bottom: 8px;
    line-height: 1.8;
}

.replay {
    display: block;
    margin: 25px auto 0;
    padding: 13px 24px;
    border: 1px solid #8d7048;
    border-radius: 2px;
    background: transparent;
    color: #e4c797;
    font-family: Georgia, serif;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
}

.replay:active {
    background: #c5a574;
    color: #080706;
}

@media (max-width: 480px) {
    .heading {
        top: 6%;
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    #drawing {
        width: 95vw;
        height: 65vh;
        top: 46%;
    }

    #center {
        top: 46%;
        letter-spacing: 1.5px;
    }

    .phrase {
        font-size: 11px;
        padding: 4px 6px;
    }

    .message {
        max-width: 340px;
    }

    #secretMessage {
        font-size: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<div id="scene">

    <div class="heading">
        ТЫСЯЧА СПОСОБОВ СКАЗАТЬ «Я ТЕБЯ ЛЮБЛЮ»
    </div>

    <svg id="drawing"
         viewBox="0 0 300 270"
         xmlns="http://www.w3.org/2000/svg"
         aria-hidden="true">

        <path id="heartLine"
            d="M150 245
               C130 225 20 155 20 85
               C20 20 100 5 150 65
               C200 5 280 20 280 85
               C280 155 170 225 150 245 Z" />
    </svg>

    <div id="center">
        Я ТЕБЯ ЛЮБЛЮ
        <div class="subtitle">
            БОЛЬШЕ, ЧЕМ МОЖНО ВЫРАЗИТЬ СЛОВАМИ
        </div>
    </div>

    <div id="finale">
        <div class="message">

            <div class="small">ТОЛЬКО ДЛЯ ТЕБЯ</div>

            <h2>Любимая</h2>

            <button
                type="button"
                class="big-heart"
                id="secretHeart"
                aria-label="Открыть признание"
                aria-expanded="false">
                ♡
            </button>

            <div id="secretMessage" aria-live="polite">
                <p>
                    Я выбираю тебя.<br>
                    Сегодня, завтра и всегда.
                </p>

                <div class="signature">
                    Ты — моё самое красивое чувство. ♥
                </div>
            </div>

            <button type="button" class="replay" id="replayButton">
                ЕЩЁ РАЗ ♥
            </button>

        </div>
    </div>

</div>

<script>
const scene = document.getElementById("scene");
const heartLine = document.getElementById("heartLine");
const center = document.getElementById("center");
const finale = document.getElementById("finale");
const secretHeart = document.getElementById("secretHeart");
const secretMessage = document.getElementById("secretMessage");
const replayButton = document.getElementById("replayButton");

let timers = [];

const phrases = [
    "I love you",
    "Я тебя люблю",
    "Je t'aime",
    "Te amo",
    "Ti amo",
    "Ich liebe dich",
    "愛してる",
    "사랑해",
    "Eu te amo",
    "我爱你",
    "Я кохаю тебе",
    "Seni seviyorum",
    "Mahal kita",
    "Ik hou van jou",
    "Jeg elsker deg",
    "Kocham cię",
    "Aš tave myliu",
    "Minä rakastan sinua",
    "أحبك",
    "Σ' αγαπώ"
];

const phraseInterval = 1550;

function clearTimers() {
    timers.forEach(function(timer) {
        clearTimeout(timer);
    });

    timers = [];
}

function showPhrase(text, index) {
    const totalLength = heartLine.getTotalLength();

    // Распределяем фразы по всей длине линии сердца.
    const distance = totalLength * index / phrases.length;

    const point = heartLine.getPointAtLength(distance);
    const matrix = heartLine.getScreenCTM();

    if (!matrix) {
        return;
    }

    const screenPoint = new DOMPoint(point.x, point.y)
        .matrixTransform(matrix);

    const sceneRect = scene.getBoundingClientRect();

    const element = document.createElement("div");

    element.className = "phrase";
    element.textContent = text;

    // Позиция берётся с настоящего контура,
    // но текст остаётся горизонтальным.
    element.style.left =
        (screenPoint.x - sceneRect.left) + "px";

    element.style.top =
        (screenPoint.y - sceneRect.top) + "px";

    scene.appendChild(element);

    const removeTimer = setTimeout(function() {
        element.remove();
    }, 1500);

    timers.push(removeTimer);
}

function revealSecret() {
    secretHeart.classList.add("open");
    secretHeart.textContent = "♥";
    secretMessage.classList.add("show");

    secretHeart.setAttribute("aria-expanded", "true");
    secretHeart.setAttribute("aria-label", "Признание открыто");
}

function resetSecret() {
    secretHeart.classList.remove("open");
    secretHeart.textContent = "♡";
    secretMessage.classList.remove("show");

    secretHeart.setAttribute("aria-expanded", "false");
    secretHeart.setAttribute(
        "aria-label",
        "Открыть признание"
    );
}

function start() {
    clearTimers();

    finale.classList.remove("show");
    center.classList.remove("show");
    resetSecret();

    scene.querySelectorAll(".phrase").forEach(function(element) {
        element.remove();
    });

    // Перезапускаем рисование сердца.
    heartLine.style.animation = "none";
    void heartLine.getBoundingClientRect();
    heartLine.style.animation = "drawHeart 4s ease forwards";

    // Фразы появляются по одной, не накладываясь друг на друга.
    phrases.forEach(function(text, index) {
        const phraseTimer = setTimeout(function() {
            showPhrase(text, index);
        }, 500 + index * phraseInterval);

        timers.push(phraseTimer);
    });

    // Центральное признание появляется после фраз.
    const centerTimer = setTimeout(function() {
        center.classList.add("show");
    }, 500 + phrases.length * phraseInterval + 500);

    timers.push(centerTimer);

    // Финальная сцена появляется последней.
    const finaleTimer = setTimeout(function() {
        finale.classList.add("show");
    }, 500 + phrases.length * phraseInterval + 2500);

    timers.push(finaleTimer);
}

secretHeart.addEventListener("click", function(event) {
    event.preventDefault();
    revealSecret();
});

replayButton.addEventListener("click", function() {
    start();
});

start();
</script>

</body>
</html>
